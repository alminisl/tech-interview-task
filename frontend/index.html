<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Collaborative Point Cloud Viewer</title>

	<link rel="stylesheet" type="text/css" href="../potree/build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../potree/libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../potree/libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../potree/libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../potree/libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="../potree/libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../potree/libs/spectrum/spectrum.js"></script>
	<script src="../potree/libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../potree/libs/other/BinaryHeap.js"></script>
	<script src="../potree/libs/tween/tween.min.js"></script>
	<script src="../potree/libs/d3/d3.js"></script>
	<script src="../potree/libs/proj4/proj4.js"></script>
	<script src="../potree/libs/openlayers3/ol.js"></script>
	<script src="../potree/libs/i18next/i18next.js"></script>
	<script src="../potree/libs/jstree/jstree.js"></script>
	<script src="../potree/libs/copc/index.js"></script>
	<script src="../potree/build/potree/potree.js"></script>
	<script src="../potree/libs/plasio/js/laslaz.js"></script>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px;">
		<div id="potree_render_area" style="background: #1a1a1a;"></div>
		<div id="potree_sidebar_container"> </div>
	</div>

	<!-- Peer presence overlay: who is connected, their cone color, and last-seen. -->
	<div id="presence" style="position: absolute; top: 10px; right: 10px; z-index: 1000; background: rgba(0,0,0,0.65); color: #fff; font-family: sans-serif; font-size: 13px; padding: 10px 12px; border-radius: 6px; min-width: 190px;">
		<div id="presence-title" style="font-weight: bold; margin-bottom: 8px;">Connected</div>
		<input id="name-input" type="text" placeholder="Your name" maxlength="32"
			style="width: 100%; box-sizing: border-box; font-size: 13px; padding: 3px 5px; margin-bottom: 8px;">
		<ul id="peer-list" style="list-style: none; margin: 0; padding: 0;"></ul>
	</div>

	<script type="module">
		import * as THREE from "../potree/libs/three.js/build/three.module.js";
		import { startPresence } from "./sync.js";

		// SoFi Stadium COPC (public dataset, ~2 GB, streamed over HTTP range requests).
		const SOFI_URL = "https://s3.amazonaws.com/hobu-lidar/sofi.copc.laz";
		// Small local sample shipped with Potree, for fast iteration while developing.
		const LOCAL_SAMPLE = "../potree/pointclouds/lion_takanawa.copc.laz";

		// ?src=local loads the small sample instead of the 2 GB SoFi file.
		const params = new URLSearchParams(window.location.search);
		const path = params.get("src") === "local" ? LOCAL_SAMPLE : SOFI_URL;

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(2_000_000);
		viewer.loadSettingsFromURL();
		viewer.setDescription("Collaborative Point Cloud Viewer");

		viewer.loadGUI(() => {
			viewer.setLanguage("en");
			$("#menu_appearance").next().show();
		});

		Potree.loadPointCloud(path, "point cloud", function (e) {
			viewer.scene.addPointCloud(e.pointcloud);

			const material = e.pointcloud.material;
			material.size = 1;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			// Elevation coloring is the default on load (not a user toggle) so the
			// structure of the cloud is readable immediately.
			material.activeAttributeName = "elevation";

			viewer.fitToScreen(0.5);

			// Size peer cones relative to the loaded cloud so they read well at any scale.
			const coneSize = e.pointcloud.boundingBox.getSize(new THREE.Vector3()).length() * 0.04;
			startPresence({ viewer, coneSize });
		});
	</script>
</body>
</html>
